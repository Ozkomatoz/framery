<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Framery, учебная копия</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--sand:#f3ebe3;--ink:#111;--mute:#8a8a8a;--card:#fbf7f3;--pad:clamp(20px,3.6vw,52px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:"Inter Tight",Inter,system-ui,sans-serif;color:var(--ink);background:#fff;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #000;outline-offset:3px}
.btn{display:inline-flex;align-items:center;gap:10px;background:#000;color:#fff;border-radius:99px;padding:13px 26px;font-size:13px;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:18px var(--pad);background:#fffd;backdrop-filter:blur(8px)}
.logo{font-weight:600;font-size:26px;letter-spacing:-.04em}
nav{display:flex;gap:clamp(18px,3vw,46px);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.right{display:flex;align-items:center;gap:16px}
.lang{display:flex;gap:2px;font-size:12px}
.lang button{border:0;background:none;padding:6px 8px;border-radius:99px;cursor:pointer;font:inherit;color:var(--mute)}
.lang button.on{background:var(--sand);color:#000}
/* placeholders */
.ph{background:linear-gradient(160deg,#efe4d4,#cdb38d);position:relative;overflow:hidden}
.ph::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,#fff6,transparent 50%)}
.pod{border:clamp(8px,1.2vw,16px) solid #1c1c1c;border-radius:clamp(20px,3vw,40px);background:linear-gradient(#f4ece0,#d6bf9c);position:relative;box-shadow:0 30px 40px #0002}
.pod.w{border-color:#f2f2f2;box-shadow:0 30px 40px #0002,inset 0 0 0 6px #111}
.pod::before{content:"";position:absolute;left:12%;right:12%;bottom:30%;height:5%;background:#b68d5b;border-radius:4px}
/* hero */
.hero{text-align:center;position:relative}
.hero h1{font-weight:400;font-size:clamp(34px,7.2vw,104px);letter-spacing:-.02em;line-height:1;position:relative;z-index:3;margin-bottom:-.32em;padding:0 var(--pad)}
.stage{height:clamp(300px,45vw,640px);position:relative}
.stage .ph{position:absolute;inset:0}
.stage .p1{position:absolute;left:12%;top:8%;width:36%;height:84%}
.stage .p2{position:absolute;left:64%;top:18%;width:17%;height:80%}
.badge{position:absolute;right:11%;top:5%;width:clamp(80px,9vw,130px);aspect-ratio:1;z-index:4;animation:spin 14s linear infinite}
.badge svg{width:100%;height:100%}
.badge .c{fill:#000}.badge text{fill:#fff;font-size:11px;letter-spacing:.12em}
@keyframes spin{to{transform:rotate(360deg)}}
.mq{overflow:hidden;white-space:nowrap}
.mq div{display:inline-block;animation:mq 22s linear infinite}
.mq span{display:inline-block;padding:0 .5em}
.mq i{font-style:normal;padding:0 .5em}
@keyframes mq{to{transform:translateX(-50%)}}
.stage .mq{position:absolute;left:0;right:0;top:30%;z-index:2;font-size:clamp(20px,3vw,42px);font-weight:500}
/* history */
.hist{height:260vh;position:relative}
.stick{position:sticky;top:0;height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:0 var(--pad);gap:6vw}
.stick .pod{width:min(34vw,460px);height:78vh;justify-self:center;margin-top:12vh}
.txt{display:grid;grid-template-columns:20px 1fr;gap:6vw;max-width:520px}
.rail{position:relative;width:2px;background:#ddd;border-radius:2px;margin:0 auto;height:420px}
.rail b{position:absolute;left:-3px;width:8px;height:44px;background:#000;border-radius:5px;top:0;transition:top .25s}
.blk{opacity:.35;transition:opacity .4s;margin-bottom:46px}
.blk.on{opacity:1}
.blk h3{font-weight:400;font-size:15px;letter-spacing:.02em;text-transform:uppercase;margin-bottom:16px}
.blk p{font-size:12.5px;line-height:1.7;font-weight:300}
/* stats */
.stats{background:var(--sand);display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:clamp(50px,8vw,110px) var(--pad)}
.stats b{display:block;font-weight:400;font-size:clamp(40px,5vw,72px);letter-spacing:-.02em}
.stats span{font-size:11px;line-height:1.5;display:block;max-width:150px;margin-top:8px}
.arch{height:clamp(300px,48vw,690px);background:#8d8d8a;position:relative;overflow:hidden;display:grid;place-items:end center}
.arch .ph{width:76%;height:88%;border-radius:999px 999px 0 0;display:grid;place-items:center;font-size:clamp(30px,5vw,70px);font-weight:600;color:#fff9;letter-spacing:-.04em}
/* team */
.team{padding:clamp(60px,8vw,110px) 0 40px;text-align:center}
.team h2{font-weight:400;font-size:clamp(24px,2.8vw,36px);letter-spacing:.01em;text-transform:uppercase}
.team .sub{font-size:11px;max-width:300px;margin:18px auto 50px;line-height:1.7}
.view{overflow:hidden;padding:0 var(--pad)}
.track{display:flex;gap:18px;transition:transform .6s cubic-bezier(.6,.1,.2,1);text-align:left}
.card{flex:0 0 clamp(220px,25%,360px);background:var(--card);border-radius:14px;padding:22px;min-height:300px;display:flex;flex-direction:column;justify-content:space-between}
.card h4{font-weight:400;font-size:14px}.card small{display:block;font-size:11px;margin-top:10px}
.card p{font-size:11px;line-height:1.65;font-weight:300}
.card .photo{display:none}
.card.on{flex-basis:clamp(300px,46%,640px);position:relative;display:block;background:transparent;padding:0}
.card.on>div:first-child,.card.on>p{display:none}
.card.on .photo{display:block;position:absolute;left:0;top:0;width:52%;height:100%;border-radius:16px;transform:rotate(-4deg);box-shadow:0 18px 30px #0003}
.card.on .tilt{position:absolute;display:block;left:36%;top:6%;width:62%;background:#f4ede6;border-radius:16px;padding:22px;transform:rotate(5deg);box-shadow:0 18px 30px #0002}
.tilt{display:none}.tilt h4{font-size:16px}.tilt p{margin-top:40px;font-size:11px}
.arrows{margin-top:46px;display:flex;gap:40px;justify-content:center}
.arrows button{background:none;border:0;font-size:22px;color:#bbb;cursor:pointer}.arrows button:hover{color:#000}
.m2{font-size:clamp(18px,2.4vw,32px);font-weight:500;margin:30px 0 50px}
/* small space */
.small{padding:0 var(--pad);position:relative;z-index:2}
.small h2{font-weight:400;font-size:clamp(30px,4.2vw,56px);line-height:1.2;letter-spacing:-.01em;text-transform:uppercase}
.small h2 em{display:inline-block;width:1.7em;height:.8em;border-radius:6px;vertical-align:middle;margin:0 .2em;background:linear-gradient(120deg,#2a2a2a 40%,#e6d7c3 40%)}
.small p{font-size:12px;margin-top:20px;max-width:300px;line-height:1.6}
.cta{background:var(--sand);margin-top:-170px;padding:260px var(--pad) 0;position:relative}
.cta .pods{position:absolute;right:9%;top:-60px;width:38%;height:640px}
.cta .pods .pod{position:absolute;bottom:60px;height:88%}
.cta .pods .a{left:0;width:56%}.cta .pods .b{right:0;width:56%;height:76%}
.cta .badge{right:20%;top:auto;bottom:-30px}
.cta h5{font-weight:400;font-size:14px;text-transform:uppercase;margin-bottom:14px}
.cta p{font-size:11px;line-height:1.7;margin-bottom:22px}
footer{display:grid;grid-template-columns:1fr 1.2fr 1.2fr 2fr;gap:20px;padding:150px 0 70px;font-size:11px}
footer h6{font-weight:400;font-size:14px;text-transform:uppercase;margin-bottom:12px}
footer a{display:block;margin-bottom:9px}
footer .big{text-align:right;font-weight:600;font-size:clamp(40px,6vw,86px);letter-spacing:-.05em;line-height:1}
.soc{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}.soc i{width:18px;height:18px;border-radius:50%;background:#222}
@media(max-width:860px){
 nav{display:none}
 .stick{grid-template-columns:1fr;align-content:center}.stick .pod{height:30vh;width:50vw;margin:0}
 .stats{grid-template-columns:1fr 1fr}
 .cta .pods{position:relative;width:100%;right:auto;top:0;margin-top:30px}
 .cta{padding-top:190px}footer{grid-template-columns:1fr 1fr}footer .big{grid-column:1/-1;text-align:left}.soc{justify-content:flex-start}
 .card.on{flex-basis:90%}
}
@media(prefers-reduced-motion:reduce){.badge,.mq div{animation:none}}

cmp:["COMPARE PODS · COMPARE PODS · ","СРАВНИТЬ КАПСУЛЫ · СРАВНИТЬ КАПСУЛЫ · ","КАПСУЛАЛАРДЫ САЛЫСТЫРУ · "],
h1:["Begins in 2010","Начало в 2010","2010 жылы басталды"],
t1:["Framery set out to change the way people work by solving one of the biggest challenges in open offices: noise. What started as a small idea to create quiet, private spaces has grown into a global movement.","Framery поставила цель изменить то, как люди работают, решив одну из главных проблем открытых офисов: шум. То, что начиналось как небольшая идея создать тихие, приватные пространства, выросло в глобальное движение.","Framery ашық кеңселердің ең үлкен мәселелерінің бірін, яғни шуды шешу арқылы адамдардың жұмыс істеу тәсілін өзгертуді мақсат етті. Тыныш, жеке кеңістіктер жасау туралы шағын идея ғаламдық қозғалысқа айналды."],
h2:["Innovative","Инновации","Инновациялық"],
t2:["With the goal of addressing the widespread issue of noise in open offices, the newly formed Framery team committed themselves to extensive research and development.","Чтобы решить повсеместную проблему шума в открытых офисах, только что сформированная команда Framery посвятила себя масштабным исследованиям и разработкам.","Ашық кеңселердегі кең таралған шу мәселесін шешу мақсатында жаңадан құрылған Framery командасы кең ауқымды зерттеулер мен әзірлемелерге бар күшін салды."],
h3:["Revolutionizing","Переворот в отрасли","Төңкеріс жасау"],
t3:["The impact of Framery's solutions quickly gained recognition as companies like Microsoft, SAP, and Deloitte integrated the pods into their offices. News of the transformative power of Framery pods spread.","Решения Framery быстро получили признание: такие компании, как Microsoft, SAP и Deloitte, установили капсулы в своих офисах. Весть о преобразующей силе капсул Framery разошлась по миру.","Framery шешімдері тез танылды: Microsoft, SAP және Deloitte сияқты компаниялар капсулаларды кеңселеріне орнатты. Framery капсулаларының өзгертуші күші туралы хабар тарады."],

let L=1,idx=0;
const $=s=>document.querySelector(s),track=$('#track');
track.innerHTML=[...TEAM,...TEAM,...TEAM].map((m,i)=>`<article class="card" style="--ph:var(--p${i%5})"><div><h4>${m[0]}</h4><small data-r></small></div><div class="photo"></div><div class="tilt"><h4>${m[0]}</h4><small data-r></small><p data-b></p></div><p data-b></p></article>`).join('');
function render(){
 document.documentElement.lang=['en','ru','kk'][L];
 document.querySelectorAll('[data-i]').forEach(e=>{const v=T[e.dataset.i][L];e.tagName==='textPath'?e.textContent=v:e.innerHTML=v});
 [...track.children].forEach((c,i)=>{c.querySelectorAll('[data-r]').forEach(e=>e.textContent=TEAM[i%5][1][L]);c.querySelectorAll('[data-b]').forEach(e=>e.textContent=TEAM[i%5][2][L])});
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',+b.dataset.l===L));
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=+b.dataset.l;render()});
const N=TEAM.length;let busy=0,tx=0;
function place(){const c=track.children[idx],p=track.children[idx-1];track.style.transform=`translateX(${-Math.max(0,c.offsetLeft-(p&&innerWidth>860?p.offsetWidth*.55:0))}px)`}
function go(n,jump){idx=n;[...track.children].forEach((c,i)=>c.classList.toggle('on',i===idx));
 if(jump)track.style.transition='none';place();if(jump){track.offsetWidth;track.style.transition=''}}
function settle(){if(idx>=2*N)go(idx-N,true);else if(idx<N)go(idx+N,true)}
function step(d){go(idx+d);clearTimeout(tx);tx=setTimeout(settle,650)}
track.addEventListener('transitionend',e=>{if(e.target===track){clearTimeout(tx);settle()}});
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
let sx=null;track.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
track.addEventListener('touchend',e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(d)>40)step(d<0?1:-1)});
go(N+1,true);addEventListener('resize',()=>go(idx,true));
// history scroll
const hist=$('.hist'),blks=[...document.querySelectorAll('.blk')],thumb=$('.rail b');
function onScroll(){const r=hist.getBoundingClientRect(),p=Math.min(1,Math.max(0,-r.top/(r.height-innerHeight))),a=Math.min(2,Math.floor(p*3));
 blks.forEach((b,i)=>b.classList.toggle('on',i===a));thumb.style.top=`calc(${p*100}% - ${p*44}px)`}
addEventListener('scroll',onScroll,{passive:true});render();onScroll();
</script>
